<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberCampus V2</title>
    <!-- Fonts Tech -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-body: #030305;
            --bg-card: #0e0e11;
            --primary: #00f3ff; /* Cyan Neon */
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff0055; /* Pink Neon */
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #333;
            --font-head: 'Orbitron', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --font-body: 'Inter', sans-serif;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-body);
            margin: 0; padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 90px;
            overflow-x: hidden;
            /* Grid Background Animation */
            background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            animation: bgScroll 20s linear infinite;
        }

        @keyframes bgScroll {
            0% { background-position: 0 0; }
            100% { background-position: 30px 30px; }
        }

        /* Glitch Effect Header */
        header {
            background: rgba(5, 5, 5, 0.9);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
            display: flex; justify-content: space-between; align-items: center;
        }

        h1 {
            margin: 0; font-family: var(--font-head); font-size: 1.2rem; text-transform: uppercase;
            color: var(--text-main); position: relative;
        }

        /* Glitch Animation Keyframes */
        .glitch { position: relative; }
        .glitch::before, .glitch::after {
            content: attr(data-text); position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-body);
        }
        .glitch::before {
            left: 2px; text-shadow: -1px 0 var(--accent); clip-path: inset(0 0 0 0);
            animation: glitch-anim-1 2s infinite linear alternate-reverse;
        }
        .glitch::after {
            left: -2px; text-shadow: -1px 0 var(--primary); clip-path: inset(0 0 0 0);
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }
        @keyframes glitch-anim-1 { 0% { clip-path: inset(20% 0 80% 0); } 20% { clip-path: inset(60% 0 10% 0); } 40% { clip-path: inset(40% 0 50% 0); } 60% { clip-path: inset(80% 0 5% 0); } 80% { clip-path: inset(10% 0 60% 0); } 100% { clip-path: inset(30% 0 30% 0); } }
        @keyframes glitch-anim-2 { 0% { clip-path: inset(10% 0 60% 0); } 20% { clip-path: inset(30% 0 10% 0); } 40% { clip-path: inset(70% 0 20% 0); } 60% { clip-path: inset(20% 0 50% 0); } 80% { clip-path: inset(50% 0 30% 0); } 100% { clip-path: inset(0% 0 80% 0); } }

        /* Layout & Animation */
        main { padding: 20px; max-width: 600px; margin: 0 auto; position: relative; z-index: 2; }
        
        .section { display: none; }
        .section.active { display: block; animation: slideUpFade 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
        
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .section-header {
            font-family: var(--font-code); color: var(--primary); font-size: 0.8rem;
            margin: 25px 0 15px 0; text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 10px;
        }
        .section-header i { font-size: 1.2rem; animation: pulseIcon 2s infinite; }
        @keyframes pulseIcon { 0%, 100% { opacity: 0.5; transform: scale(1); } 50% { opacity: 1; transform: scale(1.2); } }

        /* Cards with 3D Tilt & Hover */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px;
            margin-bottom: 16px;
            position: relative;
            transition: all 0.3s ease;
            transform-style: preserve-3d;
            overflow: hidden;
        }

        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary); opacity: 0.5; transition: 0.3s;
        }
        
        .card:hover {
            transform: translateY(-5px) scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.15);
        }
        .card:hover::before { opacity: 1; box-shadow: 0 0 10px var(--primary); }

        .card-title { font-family: var(--font-head); font-size: 1.1rem; margin: 0 0 5px 0; color: #fff; }
        .card-subtitle { font-family: var(--font-code); font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
        
        .tag {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-family: var(--font-code); font-size: 0.7rem; margin-top: 10px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-muted);
        }

        /* Today Highlight */
        .card.today-active { border-color: #00ff9d; background: linear-gradient(135deg, rgba(0,255,157,0.05), transparent); }
        .card.today-active:hover { box-shadow: 0 10px 30px rgba(0, 255, 157, 0.15); }
        .card.today-active::before { background: #00ff9d; }
        .card.today-active .card-subtitle { color: #00ff9d; }

        /* Buttons */
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: 0.2s;
        }
        .btn-icon:hover { background: var(--primary); color: #000; transform: rotate(10deg); }
        .btn-icon.delete:hover { background: var(--accent); color: #fff; box-shadow: 0 0 10px var(--accent); }

        /* FAB */
        .fab {
            position: fixed; bottom: 90px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--bg-card); border: 2px solid var(--primary);
            color: var(--primary); font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow); cursor: pointer; z-index: 90;
            animation: bounceFloat 3s infinite ease-in-out;
        }
        .fab:active { transform: scale(0.9); }
        @keyframes bounceFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(3, 3, 5, 0.95); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 10px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-code);
            cursor: pointer; width: 25%; transition: 0.3s;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 8px var(--primary-glow); }
        .nav-item.active i { transform: translateY(-5px); filter: drop-shadow(0 0 5px var(--primary)); }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            z-index: 200; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-content {
            background: #111; width: 100%; max-width: 600px;
            border-radius: 24px 24px 0 0; padding: 24px;
            border: 1px solid var(--border); border-top: 2px solid var(--accent);
            animation: slideUpModal 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh; overflow-y: auto;
        }
        @keyframes slideUpModal { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* Forms */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 8px; font-family: var(--font-code); font-size: 0.8rem; color: var(--primary); }
        
        .form-input, .form-select, .form-textarea {
            width: 100%; padding: 14px; background: #050505;
            border: 1px solid var(--border); border-radius: 8px;
            color: #fff; font-family: var(--font-code); font-size: 0.95rem;
            transition: 0.3s;
        }
        .form-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px var(--primary-glow); }

        .btn-primary {
            width: 100%; padding: 16px; background: var(--primary); color: #000;
            border: none; border-radius: 8px; font-family: var(--font-head); font-weight: 900;
            cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 20px var(--primary-glow); position: relative; overflow: hidden;
        }
        .btn-primary::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .btn-primary:hover::after { left: 100%; }

        /* Task Tabs */
        .task-tabs { display: flex; background: #111; padding: 4px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .task-tab {
            flex: 1; text-align: center; padding: 12px; cursor: pointer;
            border-radius: 8px; font-family: var(--font-code); font-size: 0.85rem;
            color: var(--text-muted); transition: 0.3s; position: relative; overflow: hidden;
        }
        .task-tab.active { background: var(--accent); color: #fff; font-weight: bold; box-shadow: 0 0 15px rgba(255, 0, 85, 0.4); }

        /* Finance */
        .finance-summary {
            background: linear-gradient(135deg, #1a1a1a, #0a0a0a); border: 1px solid var(--border);
            padding: 24px; border-radius: 20px; margin-bottom: 24px; text-align: center;
            position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .finance-label { font-family: var(--font-code); color: var(--text-muted); font-size: 0.8rem; }
        .finance-value { font-family: var(--font-head); font-size: 2rem; margin: 10px 0; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .finance-expense { color: var(--accent); font-family: var(--font-code); font-size: 0.9rem; }
        .edit-balance-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 4px 10px; margin-top: 10px; cursor: pointer; border-radius: 4px; font-size: 0.7rem; }
        .edit-balance-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* Toast */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-50px);
            background: rgba(0, 0, 0, 0.9); border: 1px solid var(--primary); color: var(--primary);
            padding: 12px 24px; border-radius: 50px; font-family: var(--font-code);
            opacity: 0; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 300;
            box-shadow: 0 0 20px var(--primary-glow); display: flex; align-items: center; gap: 8px;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 40px 20px; border: 1px dashed var(--border); border-radius: var(--radius); }
        .empty-state i { font-size: 3rem; margin-bottom: 10px; opacity: 0.3; color: #fff; }

    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 id="page-title" class="glitch" data-text="JADWAL GUE">JADWAL GUE</h1>
        <div style="color:var(--primary);"><i class="ph ph-cpu" style="font-size:1.5rem; animation:spin 4s linear infinite;"></i></div>
    </header>
    <style>@keyframes spin { 100% { transform:rotate(360deg); } }</style>

    <main>
        <!-- 1. JADWAL KULIAH -->
        <section id="schedule-section" class="section active">
            
            <div id="today-label" class="section-header" style="display:none; color:#00ff9d;">
                <i class="ph ph-lightning"></i> JADWAL HARI INI (NYALA)
            </div>
            <div id="today-list"></div>

            <div class="section-header">
                <i class="ph ph-list-dashes"></i> SEMUA DATA JADWAL
            </div>
            <div id="schedule-list"></div>
        </section>

        <!-- 2. JADWAL HARIAN -->
        <section id="daily-section" class="section">
            <div class="section-header"><i class="ph ph-calendar-plus"></i> CATATAN HARIAN</div>
            <div id="daily-list"></div>
        </section>

        <!-- 3. TUGAS KULIAH -->
        <section id="task-section" class="section">
            <div class="task-tabs">
                <div class="task-tab active" onclick="switchTaskTab('pending')">MASIH NIH</div>
                <div class="task-tab" onclick="switchTaskTab('completed')">UDAH KELAR</div>
            </div>
            <div id="task-list"></div>
        </section>

        <!-- 4. KEUANGAN -->
        <section id="finance-section" class="section">
            <div class="finance-summary">
                <div class="finance-label">SISA DUIT GUE</div>
                <div class="finance-value" id="display-balance">Rp 0</div>
                <div class="finance-expense">Udah Keluar: <span id="display-expense">Rp 0</span></div>
                <button onclick="openFinanceModal()" class="edit-balance-btn">[ GANTI SALDO UTAMA ]</button>
            </div>
            <div class="section-header"><i class="ph ph-receipt"></i> RIWAYAT TRANSAKSI</div>
            <div id="expense-list"></div>
        </section>
    </main>

    <button class="fab" onclick="openAddModal()">
        <i class="ph ph-plus"></i>
    </button>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('schedule', this)">
            <i class="ph ph-calendar-check"></i>
            <span>JADWAL</span>
        </div>
        <div class="nav-item" onclick="switchTab('daily', this)">
            <i class="ph ph-calendar-blank"></i>
            <span>NOTES</span>
        </div>
        <div class="nav-item" onclick="switchTab('task', this)">
            <i class="ph ph-clipboard-text"></i>
            <span>TUGAS</span>
        </div>
        <div class="nav-item" onclick="switchTab('finance', this)">
            <i class="ph ph-wallet"></i>
            <span>DOMPET</span>
        </div>
    </nav>

    <!-- Modal -->
    <div class="modal-overlay" id="main-modal">
        <div class="modal-content">
            <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 style="margin:0; font-family:var(--font-head); color:var(--text-main);" id="modal-title">INPUT BARU</h2>
                <button class="btn-icon" onclick="closeModal()" style="width:30px; height:30px;"><i class="ph ph-x"></i></button>
            </div>
            <form id="main-form">
                <div id="form-fields"></div>
                <button type="submit" class="btn-primary">GAS!</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"><i class="ph ph-check-circle"></i> <span>Berhasil!</span></div>

    <script>
        // --- DATA (Sudah ada ruangan) ---
        let schedules = [
            { id: 1, day: 'Senin', time: '08:00', subject: 'Algoritma Pemrograman', lecturer: 'Pak Budi', room: 'Lab. Komputer 1' },
            { id: 2, day: 'Rabu', time: '10:00', subject: 'Basis Data', lecturer: 'Bu Siti', room: 'R. Teori 204' }
        ];

        let dailies = [
            { id: 1, date: '2023-10-30', time: '16:00', event: 'Rapat UKM' }
        ];

        let tasks = [
            { id: 1, subject: 'Algoritma Pemrograman', lecturer: 'Pak Budi', startDate: '2023-10-28', dueDate: '2023-11-02', submissionType: 'file', submissionData: 'tugas_algo.zip', status: 'pending' }
        ];

        let finance = {
            currentBalance: 500000,
            expenses: [
                { id: 1, name: 'Jajan Martabak', amount: 25000, date: '2023-10-25' },
                { id: 2, name: 'Baterai Laptop', amount: 150000, date: '2023-10-26' }
            ]
        };

        let currentTab = 'schedule';
        let currentTaskTab = 'pending';
        let editingId = null;
        let editingType = null;

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            updateTodayHighlight();
        });

        // --- TYPEWRITER EFFECT ---
        function typeWriter(text, elementId, speed = 50) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            element.setAttribute('data-text', text); // Update glitch text
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                }
            }
            type();
        }

        // --- CORE FUNCTIONS ---
        function updateTodayHighlight() {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = days[new Date().getDay()];
            const hasTodaySchedule = schedules.some(s => s.day === todayName);
            document.getElementById('today-label').style.display = hasTodaySchedule ? 'flex' : 'none';
        }

        function renderAll() {
            renderSchedule();
            renderDaily();
            renderTasks();
            renderFinance();
        }

        // --- NAVIGATION ---
        function switchTab(tabName, el) {
            currentTab = tabName;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
            
            const titles = {
                'schedule': 'JADWAL GUE',
                'daily': 'CATETAN HARIAN',
                'task': 'DAFTAR TUGAS',
                'finance': 'CEK DOMPET'
            };
            
            // Panggil efek ngetik
            typeWriter(titles[tabName], 'page-title');

            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(`${tabName}-section`).classList.add('active');
            renderAll();
        }

        function switchTaskTab(status) {
            currentTaskTab = status;
            document.querySelectorAll('.task-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        // --- RENDERING ---
        function renderSchedule() {
            const todayList = document.getElementById('today-list');
            const scheduleList = document.getElementById('schedule-list');
            todayList.innerHTML = '';
            scheduleList.innerHTML = '';

            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = days[new Date().getDay()];
            const dayOrder = {'Senin':1,'Selasa':2,'Rabu':3,'Kamis':4,'Jumat':5,'Sabtu':6,'Minggu':7};
            
            schedules.sort((a,b) => (dayOrder[a.day] || 99) - (dayOrder[b.day] || 99) || a.time.localeCompare(b.time));

            schedules.forEach(item => {
                const isToday = (item.day === todayName);
                const container = isToday ? todayList : scheduleList;
                
                // HTML Kartu dengan Ruangan
                const html = `
                    <div class="card ${isToday ? 'today-active' : ''}">
                        <div class="card-title">${item.subject}</div>
                        <div class="card-subtitle"><i class="ph ph-clock"></i> ${item.day} // ${item.time}</div>
                        
                        <!-- Ruangan Display -->
                        <div class="tag" style="margin-top:8px; border-color:var(--primary); color:var(--primary);">
                            <i class="ph ph-map-pin"></i> ${item.room || '-'}
                        </div>

                        <div style="margin-top:12px; font-size:0.85rem; color:var(--text-muted);">
                            <i class="ph ph-chalkboard-teacher"></i> ${item.lecturer}
                        </div>

                        <div class="card-actions" style="margin-top:15px; display:flex; gap:8px;">
                            <button class="btn-icon" onclick="openEditModal('schedule', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('schedule', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
            updateTodayHighlight();
        }

        function renderDaily() {
            const container = document.getElementById('daily-list');
            container.innerHTML = '';
            if(dailies.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="ph ph-coffee"></i><p>Belum ada catetan</p></div>`;
                return;
            }
            dailies.sort((a,b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time));
            dailies.forEach(item => {
                const html = `
                    <div class="card">
                        <div class="card-title">${item.event}</div>
                        <div class="card-subtitle"><i class="ph ph-calendar"></i> ${item.date} • ${item.time}</div>
                        <div class="card-actions">
                            <button class="btn-icon" onclick="openEditModal('daily', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('daily', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';
            const filteredTasks = tasks.filter(t => t.status === currentTaskTab);
            if(filteredTasks.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="ph ph-clipboard-text"></i><p>Tugas kosong melompong</p></div>`;
                return;
            }

            filteredTasks.forEach(item => {
                const isPending = item.status === 'pending';
                const html = `
                    <div class="card" style="border-left: 3px solid ${isPending ? 'var(--accent)' : '#00ff9d'}">
                        <div class="card-title">${item.subject}</div>
                        <div class="card-subtitle" style="color:${isPending ? 'var(--accent)' : '#00ff9d'}">
                            <i class="ph ph-user"></i> ${item.lecturer}
                        </div>
                        <div style="margin-top:10px; font-family:var(--font-code); font-size:0.8rem; color:var(--text-muted);">
                            Deadline: ${item.dueDate}
                        </div>
                        <div class="card-actions">
                            ${isPending ? `<button class="btn-icon" onclick="completeTask(${item.id})"><i class="ph ph-check"></i> Selesai</button>` : `<button class="btn-icon" onclick="downloadTaskItem(${item.id})"><i class="ph ph-download-simple"></i></button>`}
                            <button class="btn-icon" onclick="openEditModal('task', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('task', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderFinance() {
            const totalExpense = finance.expenses.reduce((sum, item) => sum + Number(item.amount), 0);
            const remaining = finance.currentBalance - totalExpense;
            document.getElementById('display-balance').innerText = formatRupiah(remaining);
            document.getElementById('display-expense').innerText = formatRupiah(totalExpense);

            const container = document.getElementById('expense-list');
            container.innerHTML = '';
            if(finance.expenses.length === 0) {
                container.innerHTML = `<div class="empty-state"><i class="ph ph-receipt"></i><p>Belum ada transaksi</p></div>`;
                return;
            }
            finance.expenses.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                const html = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div class="card-title" style="font-size:1rem;">${item.name}</div>
                            <div style="color:var(--accent); font-family:var(--font-code); font-weight:bold;">- ${formatRupiah(item.amount)}</div>
                        </div>
                        <div class="card-subtitle">${item.date}</div>
                        <div class="card-actions">
                            <button class="btn-icon delete" onclick="deleteItem('expense', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        // --- FORM & MODAL ---
        function openAddModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = 'TAMBAH DATA BARU';
            document.getElementById('main-form').reset();
            renderFormFields(currentTab);
            document.getElementById('main-modal').classList.add('open');
        }

        function openEditModal(type, id) {
            editingId = id;
            document.getElementById('modal-title').innerText = 'EDIT DATA';
            renderFormFields(type, id);
            document.getElementById('main-modal').classList.add('open');
        }

        function openFinanceModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = 'ATUR SALDO';
            renderFormFields('finance-balance');
            document.getElementById('main-modal').classList.add('open');
        }

        function closeModal() { document.getElementById('main-modal').classList.remove('open'); }

        function renderFormFields(type, id = null) {
            const container = document.getElementById('form-fields');
            container.innerHTML = '';
            let data = null;
            if(id) {
                if(type === 'schedule') data = schedules.find(s => s.id === id);
                if(type === 'daily') data = dailies.find(d => d.id === id);
                if(type === 'task') data = tasks.find(t => t.id === id);
                if(type === 'expense') data = finance.expenses.find(e => e.id === id);
            }

            if (type === 'schedule') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">MATA KULIAH</label><input type="text" name="subject" class="form-input" required placeholder="Contoh: Web Design" value="${data ? data.subject : ''}"></div>
                    <div class="form-group"><label class="form-label">DOSEN</label><input type="text" name="lecturer" class="form-input" required placeholder="Nama Dosen" value="${data ? data.lecturer : ''}"></div>
                    <div class="form-group"><label class="form-label">HARI</label>
                        <select name="day" class="form-select" required>
                            <option value="Senin" ${data && data.day === 'Senin' ? 'selected' : ''}>Senin</option>
                            <option value="Selasa" ${data && data.day === 'Selasa' ? 'selected' : ''}>Selasa</option>
                            <option value="Rabu" ${data && data.day === 'Rabu' ? 'selected' : ''}>Rabu</option>
                            <option value="Kamis" ${data && data.day === 'Kamis' ? 'selected' : ''}>Kamis</option>
                            <option value="Jumat" ${data && data.day === 'Jumat' ? 'selected' : ''}>Jumat</option>
                            <option value="Sabtu" ${data && data.day === 'Sabtu' ? 'selected' : ''}>Sabtu</option>
                            <option value="Minggu" ${data && data.day === 'Minggu' ? 'selected' : ''}>Minggu</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">JAM</label><input type="time" name="time" class="form-input" required value="${data ? data.time : ''}"></div>
                    <div class="form-group"><label class="form-label">RUANGAN</label><input type="text" name="room" class="form-input" required placeholder="Contoh: Lab 1" value="${data ? data.room : ''}"></div>
                `;
            } else if (type === 'daily') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">ACARA</label><input type="text" name="event" class="form-input" required value="${data ? data.event : ''}"></div>
                    <div class="form-group"><label class="form-label">TANGGAL</label><input type="date" name="date" class="form-input" required value="${data ? data.date : ''}"></div>
                    <div class="form-group"><label class="form-label">JAM</label><input type="time" name="time" class="form-input" required value="${data ? data.time : ''}"></div>
                `;
            } else if (type === 'task') {
                const uniqueSubjects = [...new Set(schedules.map(s => s.subject))];
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">MATA KULIAH</label>
                        <select name="subject" class="form-select" id="taskSubjectSelect" onchange="autoFillLecturer()" required>
                            <option value="">-- Pilih Matkul --</option>
                            ${uniqueSubjects.map(sub => `<option value="${sub}" ${data && data.subject === sub ? 'selected' : ''}>${sub}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">DOSEN (Otomatis)</label><input type="text" name="lecturer" id="taskLecturerInput" class="form-input" readonly value="${data ? data.lecturer : ''}"></div>
                    <div class="form-group"><label class="form-label">MULAI</label><input type="date" name="startDate" class="form-input" required value="${data ? data.startDate : ''}"></div>
                    <div class="form-group"><label class="form-label">DEADLINE</label><input type="date" name="dueDate" class="form-input" required value="${data ? data.dueDate : ''}"></div>
                    <div class="form-group"><label class="form-label">JENIS PENGUMPULAN</label>
                        <select name="submissionType" class="form-select" onchange="toggleSubmissionInput()" required>
                            <option value="text" ${data && data.submissionType === 'text' ? 'selected' : ''}>Teks</option>
                            <option value="file" ${data && data.submissionType === 'file' ? 'selected' : ''}>File</option>
                        </select>
                    </div>
                    <div class="form-group" id="submissionDataGroup">
                        <label class="form-label">ISI PENGUMPULAN</label>
                        <input type="text" id="subText" name="submissionDataText" class="form-input" placeholder="Ketik disini..." style="display:${data && data.submissionType==='text'?'block':'none'}" value="${data && data.submissionType==='text'?data.submissionData:''}">
                        <input type="file" id="subFile" name="submissionDataFile" class="form-input" style="display:${data && data.submissionType==='file'?'block':'none'}">
                        <input type="hidden" name="existingData" value="${data ? data.submissionData : ''}">
                    </div>
                `;
            } else if (type === 'finance-balance') {
                container.innerHTML = `<div class="form-group"><label class="form-label">SALDO UTAMA</label><input type="number" name="balance" class="form-input" required value="${finance.currentBalance}"></div>`;
            } else if (type === 'finance' || (currentTab === 'finance' && !id)) {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">NAMA PENGELUARAN</label><input type="text" name="name" class="form-input" required value="${data ? data.name : ''}"></div>
                    <div class="form-group"><label class="form-label">JUMLAH (Rp)</label><input type="number" name="amount" class="form-input" required value="${data ? data.amount : ''}"></div>
                    <div class="form-group"><label class="form-label">TANGGAL</label><input type="date" name="date" class="form-input" required value="${data ? data.date : ''}"></div>
                `;
            }
            if(type === 'task' && data) autoFillLecturer();
        }

        function autoFillLecturer() {
            const subjectSelect = document.getElementById('taskSubjectSelect');
            const lecturerInput = document.getElementById('taskLecturerInput');
            const schedule = schedules.find(s => s.subject === subjectSelect.value);
            lecturerInput.value = schedule ? schedule.lecturer : '';
        }

        function toggleSubmissionInput() {
            const type = document.querySelector('select[name="submissionType"]').value;
            document.getElementById('subText').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('subFile').style.display = type === 'file' ? 'block' : 'none';
        }

        function completeTask(id) {
            const task = tasks.find(t => t.id === id);
            if(task) { task.status = 'completed'; showToast('Tugas udah kelar!'); renderTasks(); }
        }

        function downloadTaskItem(id) {
            const task = tasks.find(t => t.id === id);
            if(!task) return;
            if(task.submissionType === 'text') {
                const textContent = `Tugas: ${task.subject}\nDosen: ${task.lecturer}\nIsi: ${task.submissionData}`;
                const blob = new Blob([textContent], { type: 'text/plain' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Tugas_${task.subject}.txt`;
                a.click();
            } else {
                showToast(`Ngedownload: ${task.submissionData}`);
            }
        }

        // --- SUBMIT & DELETE ---
        document.getElementById('main-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            
            if (currentTab === 'schedule' || editingType === 'schedule') {
                // TAMBAHAN FIELD ROOM
                const newData = { 
                    id: editingId || Date.now(), 
                    subject: formData.get('subject'), 
                    lecturer: formData.get('lecturer'), 
                    day: formData.get('day'), 
                    time: formData.get('time'),
                    room: formData.get('room') // New Field
                };
                updateArray(schedules, newData);
            } 
            else if (currentTab === 'daily' || editingType === 'daily') {
                const newData = { id: editingId || Date.now(), event: formData.get('event'), date: formData.get('date'), time: formData.get('time') };
                updateArray(dailies, newData);
            }
            else if (currentTab === 'task' || editingType === 'task') {
                let subData = '';
                const type = formData.get('submissionType');
                if(type === 'text') subData = formData.get('submissionDataText');
                else {
                    const fileInput = document.getElementById('subFile');
                    subData = fileInput.files.length > 0 ? fileInput.files[0].name : formData.get('existingData');
                }
                const newData = { id: editingId || Date.now(), subject: formData.get('subject'), lecturer: formData.get('lecturer'), startDate: formData.get('startDate'), dueDate: formData.get('dueDate'), submissionType: type, submissionData: subData, status: editingId ? tasks.find(t=>t.id===editingId).status : 'pending' };
                updateArray(tasks, newData);
            }
            else if (currentTab === 'finance') {
                const newData = { id: editingId || Date.now(), name: formData.get('name'), amount: formData.get('amount'), date: formData.get('date') };
                updateArray(finance.expenses, newData);
            }
            else if (editingType === 'finance-balance') {
                finance.currentBalance = formData.get('balance');
                showToast('Saldo diupdate!');
                renderFinance(); closeModal(); return;
            }

            renderAll(); closeModal(); showToast('Data masuk!');
        });

        function updateArray(arr, data) {
            const index = arr.findIndex(item => item.id === data.id);
            index > -1 ? arr[index] = data : arr.push(data);
        }

        function deleteItem(type, id) {
            if(!confirm('Yakin mau dihapus?')) return;
            if(type === 'schedule') schedules = schedules.filter(i => i.id !== id);
            if(type === 'daily') dailies = dailies.filter(i => i.id !== id);
            if(type === 'task') tasks = tasks.filter(i => i.id !== id);
            if(type === 'expense') finance.expenses = finance.expenses.filter(i => i.id !== id);
            renderAll(); showToast('Data ilang!');
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }
        function showToast(msg) {
            const t = document.getElementById('toast'); 
            t.querySelector('span').innerText = msg; 
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
