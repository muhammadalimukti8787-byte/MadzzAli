<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberCampus STABLE</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        :root {
            --bg-body: #030305;
            --bg-card: #0e0e11;
            --primary: #00f3ff;
            --primary-glow: rgba(0, 243, 255, 0.4);
            --accent: #ff0055;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border: #333;
            --font-head: 'Orbitron', sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --font-body: 'Inter', sans-serif;
            --radius: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }

        body {
            font-family: var(--font-body);
            margin: 0; padding: 0;
            background-color: var(--bg-body);
            color: var(--text-main);
            padding-bottom: 90px;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
            linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* HEADER */
        header {
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 100;
            border-bottom: 2px solid var(--primary);
            display: flex; justify-content: space-between; align-items: center;
        }

        h1 {
            margin: 0; font-family: var(--font-head); font-size: 1.1rem; text-transform: uppercase;
            color: var(--text-main); letter-spacing: 1px;
        }

        /* MAIN LAYOUT */
        main { padding: 20px; max-width: 600px; margin: 0 auto; position: relative; z-index: 2; }
        
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .section-header {
            font-family: var(--font-code); color: var(--primary); font-size: 0.8rem;
            margin: 25px 0 15px 0; text-transform: uppercase; letter-spacing: 2px;
            display: flex; align-items: center; gap: 8px;
        }

        /* CARDS */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px;
            margin-bottom: 14px;
            position: relative;
            transition: all 0.2s ease;
        }

        .card:active { transform: scale(0.98); } /* Mobile feedback */
        .card:hover { border-color: var(--primary); }

        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: var(--primary);
        }

        .card-title { font-family: var(--font-head); font-size: 1rem; margin: 0 0 5px 0; color: #fff; }
        .card-subtitle { font-family: var(--font-code); font-size: 0.8rem; color: var(--text-muted); display: flex; align-items: center; gap: 6px; margin-bottom: 8px;}
        
        .tag {
            display: inline-block; padding: 4px 8px; border-radius: 4px;
            font-family: var(--font-code); font-size: 0.7rem; margin-top: 8px;
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text-muted);
        }

        /* TODAY HIGHLIGHT */
        .card.today-active { border-color: #00ff9d; background: linear-gradient(135deg, rgba(0,255,157,0.05), transparent); }
        .card.today-active::before { background: #00ff9d; }
        .card.today-active .card-subtitle { color: #00ff9d; }

        /* BUTTONS */
        .btn-icon {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff;
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; margin-left: 8px;
        }
        .btn-icon:active { background: var(--primary); color: #000; }
        .btn-icon.delete:active { background: var(--accent); color: #fff; }

        /* FAB */
        .fab {
            position: fixed; bottom: 90px; right: 20px;
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--primary); color: #000; font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow); z-index: 99;
            border: none; cursor: pointer;
        }
        .fab:active { transform: scale(0.9); }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%;
            background: rgba(3, 3, 5, 0.98); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 12px 0;
            z-index: 100;
        }
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            font-size: 0.7rem; color: var(--text-muted); font-family: var(--font-code);
            cursor: pointer; width: 25%;
        }
        .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary); }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
            z-index: 200; display: none; align-items: flex-end; justify-content: center;
        }
        .modal-overlay.open { display: flex; }
        .modal-content {
            background: #111; width: 100%; max-width: 600px;
            border-radius: 20px 20px 0 0; padding: 24px; padding-bottom: 40px;
            border-top: 2px solid var(--primary);
            max-height: 85vh; overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        /* FORMS */
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; margin-bottom: 6px; font-family: var(--font-code); font-size: 0.8rem; color: var(--primary); }
        
        .form-input, .form-select {
            width: 100%; padding: 14px; background: #050505;
            border: 1px solid var(--border); border-radius: 8px;
            color: #fff; font-family: var(--font-body); font-size: 1rem;
        }
        .form-input:focus { border-color: var(--primary); }

        .btn-primary {
            width: 100%; padding: 16px; background: var(--primary); color: #000;
            border: none; border-radius: 8px; font-family: var(--font-head); font-weight: 900;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            margin-top: 10px;
        }

        /* TASK TABS */
        .task-tabs { display: flex; background: #111; padding: 4px; border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--border); }
        .task-tab {
            flex: 1; text-align: center; padding: 10px; cursor: pointer;
            border-radius: 6px; font-family: var(--font-code); font-size: 0.8rem;
            color: var(--text-muted);
        }
        .task-tab.active { background: var(--accent); color: #fff; font-weight: bold; }

        /* FINANCE */
        .finance-summary {
            background: #111; border: 1px solid var(--border); padding: 20px;
            border-radius: 16px; margin-bottom: 20px; text-align: center;
        }
        .finance-label { font-family: var(--font-code); color: var(--text-muted); font-size: 0.8rem; }
        .finance-value { font-family: var(--font-head); font-size: 1.8rem; margin: 10px 0; color: #fff; }
        .finance-expense { color: var(--accent); font-family: var(--font-code); font-size: 0.9rem; }
        .text-btn { background:none; border:none; color:var(--primary); font-size:0.8rem; cursor:pointer; text-decoration:underline; margin-top:10px; display:block;}

        /* TOAST */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
            background: #000; border: 1px solid var(--primary); color: var(--primary);
            padding: 10px 20px; border-radius: 30px; font-family: var(--font-code); font-size: 0.85rem;
            opacity: 0; transition: 0.3s; z-index: 300; pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        .empty-state { text-align: center; color: var(--text-muted); padding: 30px; opacity: 0.6; }
        .empty-state i { font-size: 2rem; margin-bottom: 8px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1 id="page-title">JADWAL GUE</h1>
        <i class="ph ph-cpu" style="color:var(--primary); font-size:1.5rem;"></i>
    </header>

    <main>
        <!-- 1. JADWAL KULIAH -->
        <section id="schedule-section" class="section active">
            <div id="today-label" class="section-header" style="display:none; color:#00ff9d;">
                <i class="ph ph-lightning"></i> JADWAL HARI INI
            </div>
            <div id="today-list"></div>

            <div class="section-header">
                <i class="ph ph-list-dashes"></i> SEMUA JADWAL
            </div>
            <div id="schedule-list"></div>
        </section>

        <!-- 2. JADWAL HARIAN -->
        <section id="daily-section" class="section">
            <div class="section-header"><i class="ph ph-calendar-plus"></i> CATATAN HARIAN</div>
            <div id="daily-list"></div>
        </section>

        <!-- 3. TUGAS KULIAH -->
        <section id="task-section" class="section">
            <div class="task-tabs">
                <div class="task-tab active" onclick="switchTaskTab('pending')">MASIH NIH</div>
                <div class="task-tab" onclick="switchTaskTab('completed')">UDAH KELAR</div>
            </div>
            <div id="task-list"></div>
        </section>

        <!-- 4. KEUANGAN -->
        <section id="finance-section" class="section">
            <div class="finance-summary">
                <div class="finance-label">SISA DUIT</div>
                <div class="finance-value" id="display-balance">Rp 0</div>
                <div class="finance-expense">Keluar: <span id="display-expense">Rp 0</span></div>
                <button onclick="openFinanceModal()" class="text-btn">Edit Saldo Utama</button>
            </div>
            <div class="section-header"><i class="ph ph-receipt"></i> RIWAYAT TRANSAKSI</div>
            <div id="expense-list"></div>
        </section>
    </main>

    <!-- Floating Action Button -->
    <button class="fab" onclick="openAddModal()">
        <i class="ph ph-plus"></i>
    </button>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('schedule', this)">
            <i class="ph ph-calendar-check"></i><span>JADWAL</span>
        </div>
        <div class="nav-item" onclick="switchTab('daily', this)">
            <i class="ph ph-calendar-blank"></i><span>NOTES</span>
        </div>
        <div class="nav-item" onclick="switchTab('task', this)">
            <i class="ph ph-clipboard-text"></i><span>TUGAS</span>
        </div>
        <div class="nav-item" onclick="switchTab('finance', this)">
            <i class="ph ph-wallet"></i><span>DOMPET</span>
        </div>
    </nav>

    <!-- Modal -->
    <div class="modal-overlay" id="main-modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                <h2 style="margin:0; font-family:var(--font-head); color:var(--text-main);" id="modal-title">INPUT BARU</h2>
                <button class="btn-icon" onclick="closeModal(null)" style="width:30px; height:30px;"><i class="ph ph-x"></i></button>
            </div>
            <form id="main-form">
                <div id="form-fields"></div>
                <button type="submit" class="btn-primary">SIMPAN</button>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">Berhasil Disimpan</div>

    <script>
        // --- DATA & STATE MANAGEMENT ---
        
        // Load data from LocalStorage or use defaults
        let schedules = JSON.parse(localStorage.getItem('schedules')) || [
            { id: 1, day: 'Senin', time: '08:00', subject: 'Algoritma', lecturer: 'Pak Budi', room: 'Lab 1' }
        ];
        let dailies = JSON.parse(localStorage.getItem('dailies')) || [];
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];
        let finance = JSON.parse(localStorage.getItem('finance')) || {
            currentBalance: 500000,
            expenses: []
        };

        let currentTab = 'schedule';
        let currentTaskTab = 'pending';
        let editingId = null;
        let editingType = null;

        // Helper: Save to LocalStorage
        function saveData() {
            localStorage.setItem('schedules', JSON.stringify(schedules));
            localStorage.setItem('dailies', JSON.stringify(dailies));
            localStorage.setItem('tasks', JSON.stringify(tasks));
            localStorage.setItem('finance', JSON.stringify(finance));
        }

        // --- INIT ---
        document.addEventListener('DOMContentLoaded', () => {
            renderAll();
            updateTodayHighlight();
        });

        // --- RENDER FUNCTIONS ---

        function renderAll() {
            renderSchedule();
            renderDaily();
            renderTasks();
            renderFinance();
        }

        function updateTodayHighlight() {
            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = days[new Date().getDay()];
            const hasToday = schedules.some(s => s.day === todayName);
            const label = document.getElementById('today-label');
            label.style.display = hasToday ? 'flex' : 'none';
        }

        function renderSchedule() {
            const todayList = document.getElementById('today-list');
            const scheduleList = document.getElementById('schedule-list');
            todayList.innerHTML = '';
            scheduleList.innerHTML = '';

            const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const todayName = days[new Date().getDay()];
            const dayOrder = {'Senin':1,'Selasa':2,'Rabu':3,'Kamis':4,'Jumat':5,'Sabtu':6,'Minggu':7};
            
            schedules.sort((a,b) => (dayOrder[a.day]||99) - (dayOrder[b.day]||99) || a.time.localeCompare(b.time));

            schedules.forEach(item => {
                const isToday = (item.day === todayName);
                const container = isToday ? todayList : scheduleList;
                const roomDisplay = item.room ? item.room : '-'; // Fix undefined
                
                const html = `
                    <div class="card ${isToday ? 'today-active' : ''}">
                        <div class="card-title">${item.subject}</div>
                        <div class="card-subtitle"><i class="ph ph-clock"></i> ${item.day}, ${item.time}</div>
                        <div class="tag"><i class="ph ph-map-pin"></i> ${roomDisplay}</div>
                        <div style="font-size:0.85rem; color:var(--text-muted); margin-top:5px;">${item.lecturer}</div>
                        <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                            <button class="btn-icon" onclick="openEditModal('schedule', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('schedule', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
            updateTodayHighlight();
        }

        function renderDaily() {
            const container = document.getElementById('daily-list');
            container.innerHTML = '';
            if(dailies.length === 0) { container.innerHTML = '<div class="empty-state"><p>Belum ada catetan</p></div>'; return; }
            
            dailies.sort((a,b) => new Date(a.date + ' ' + a.time) - new Date(b.date + ' ' + b.time)).forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <div class="card-title">${item.event}</div>
                        <div class="card-subtitle"><i class="ph ph-calendar"></i> ${item.date} • ${item.time}</div>
                        <div style="display:flex; justify-content:flex-end;">
                            <button class="btn-icon" onclick="openEditModal('daily', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('daily', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        function renderTasks() {
            const container = document.getElementById('task-list');
            container.innerHTML = '';
            const filtered = tasks.filter(t => t.status === currentTaskTab);
            if(filtered.length === 0) { container.innerHTML = '<div class="empty-state"><p>Tugas kosong</p></div>'; return; }

            filtered.forEach(item => {
                const isPending = item.status === 'pending';
                const html = `
                    <div class="card" style="border-left: 3px solid ${isPending ? 'var(--accent)' : '#00ff9d'}">
                        <div class="card-title">${item.subject}</div>
                        <div class="card-subtitle" style="color:${isPending ? 'var(--accent)' : '#00ff9d'}">${item.lecturer}</div>
                        <div style="font-size:0.8rem; color:var(--text-muted); margin-top:5px;">Deadline: ${item.dueDate}</div>
                        <div style="display:flex; justify-content:flex-end; gap:5px; margin-top:10px;">
                            ${isPending ? `<button class="btn-icon" style="color:#00ff9d; border-color:#00ff9d;" onclick="completeTask(${item.id})"><i class="ph ph-check"></i></button>` : `<button class="btn-icon" onclick="downloadTask(${item.id})"><i class="ph ph-download-simple"></i></button>`}
                            <button class="btn-icon" onclick="openEditModal('task', ${item.id})"><i class="ph ph-pencil-simple"></i></button>
                            <button class="btn-icon delete" onclick="deleteItem('task', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });
        }

        function renderFinance() {
            const total = finance.expenses.reduce((sum, i) => sum + Number(i.amount), 0);
            const remaining = finance.currentBalance - total;
            document.getElementById('display-balance').innerText = formatRupiah(remaining);
            document.getElementById('display-expense').innerText = formatRupiah(total);

            const container = document.getElementById('expense-list');
            container.innerHTML = '';
            if(finance.expenses.length === 0) { container.innerHTML = '<div class="empty-state"><p>Belum ada transaksi</p></div>'; return; }

            finance.expenses.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(item => {
                container.innerHTML += `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between;">
                            <div class="card-title">${item.name}</div>
                            <div style="color:var(--accent); font-family:var(--font-code);">- ${formatRupiah(item.amount)}</div>
                        </div>
                        <div class="card-subtitle">${item.date}</div>
                        <div style="display:flex; justify-content:flex-end;">
                            <button class="btn-icon delete" onclick="deleteItem('expense', ${item.id})"><i class="ph ph-trash"></i></button>
                        </div>
                    </div>
                `;
            });
        }

        // --- NAVIGATION & ACTIONS ---

        function switchTab(name, el) {
            currentTab = name;
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
            
            const titles = {'schedule':'JADWAL GUE', 'daily':'CATETAN HARIAN', 'task':'DAFTAR TUGAS', 'finance':'DOMPET KU'};
            document.getElementById('page-title').innerText = titles[name];

            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(name+'-section').classList.add('active');
            renderAll();
        }

        function switchTaskTab(status) {
            currentTaskTab = status;
            document.querySelectorAll('.task-tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            renderTasks();
        }

        function completeTask(id) {
            const t = tasks.find(x => x.id === id);
            if(t) { t.status = 'completed'; saveData(); renderTasks(); showToast('Tugas Selesai!'); }
        }

        function downloadTask(id) {
            const t = tasks.find(x => x.id === id);
            if(!t) return;
            if(t.submissionType === 'text') {
                const blob = new Blob([`Tugas: ${t.subject}\nIsi: ${t.submissionData}`], {type:'text/plain'});
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `Tugas_${t.subject}.txt`;
                a.click();
            } else {
                showToast(`Download: ${t.submissionData}`);
            }
        }

        // --- FORM & MODAL LOGIC ---

        function openAddModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = 'TAMBAH DATA';
            document.getElementById('main-form').reset();
            renderFormFields(currentTab);
            document.getElementById('main-modal').classList.add('open');
        }

        function openEditModal(type, id) {
            editingId = id;
            document.getElementById('modal-title').innerText = 'EDIT DATA';
            renderFormFields(type, id);
            document.getElementById('main-modal').classList.add('open');
        }

        function openFinanceModal() {
            editingId = null;
            document.getElementById('modal-title').innerText = 'EDIT SALDO';
            renderFormFields('finance-balance');
            document.getElementById('main-modal').classList.add('open');
        }

        function closeModal(e) {
            if(!e || e.target === e.currentTarget) {
                document.getElementById('main-modal').classList.remove('open');
            }
        }

        function renderFormFields(type, id = null) {
            const container = document.getElementById('form-fields');
            container.innerHTML = '';
            let data = null;
            if(id) {
                if(type === 'schedule') data = schedules.find(s => s.id === id);
                if(type === 'daily') data = dailies.find(d => d.id === id);
                if(type === 'task') data = tasks.find(t => t.id === id);
                if(type === 'expense') data = finance.expenses.find(e => e.id === id);
            }

            if (type === 'schedule') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Matkul</label><input type="text" name="subject" class="form-input" required value="${data ? data.subject : ''}"></div>
                    <div class="form-group"><label class="form-label">Dosen</label><input type="text" name="lecturer" class="form-input" required value="${data ? data.lecturer : ''}"></div>
                    <div class="form-group"><label class="form-label">Hari</label>
                        <select name="day" class="form-select" required>
                            ${['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'].map(d=>`<option value="${d}" ${data && data.day===d?'selected':''}>${d}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">Jam</label><input type="time" name="time" class="form-input" required value="${data ? data.time : ''}"></div>
                    <div class="form-group"><label class="form-label">Ruangan</label><input type="text" name="room" class="form-input" required value="${data ? data.room || '' : ''}"></div>
                `;
            } else if (type === 'daily') {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Acara</label><input type="text" name="event" class="form-input" required value="${data ? data.event : ''}"></div>
                    <div class="form-group"><label class="form-label">Tanggal</label><input type="date" name="date" class="form-input" required value="${data ? data.date : ''}"></div>
                    <div class="form-group"><label class="form-label">Jam</label><input type="time" name="time" class="form-input" required value="${data ? data.time : ''}"></div>
                `;
            } else if (type === 'task') {
                const subs = [...new Set(schedules.map(s => s.subject))];
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Matkul</label>
                        <select name="subject" class="form-select" id="taskSubSel" onchange="autoFillLec()" required>
                            <option value="">-- Pilih --</option>
                            ${subs.map(s=>`<option value="${s}" ${data && data.subject===s?'selected':''}>${s}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">Dosen (Auto)</label><input type="text" name="lecturer" id="taskLecIn" class="form-input" readonly value="${data ? data.lecturer : ''}"></div>
                    <div class="form-group"><label class="form-label">Mulai</label><input type="date" name="startDate" class="form-input" required value="${data ? data.startDate : ''}"></div>
                    <div class="form-group"><label class="form-label">Deadline</label><input type="date" name="dueDate" class="form-input" required value="${data ? data.dueDate : ''}"></div>
                    <div class="form-group"><label class="form-label">Jenis</label>
                        <select name="submissionType" class="form-select" onchange="toggleSubInp()" required>
                            <option value="text" ${data && data.submissionType==='text'?'selected':''}>Teks</option>
                            <option value="file" ${data && data.submissionType==='file'?'selected':''}>File</option>
                        </select>
                    </div>
                    <div class="form-group" id="subDataGrp">
                        <label class="form-label">Isi</label>
                        <input type="text" id="subTxt" name="submissionDataText" class="form-input" placeholder="Ketik..." style="display:${data && data.submissionType==='text'?'block':'none'}" value="${data && data.submissionType==='text'?data.submissionData:''}">
                        <input type="file" id="subFile" name="submissionDataFile" class="form-input" style="display:${data && data.submissionType==='file'?'block':'none'}">
                        <input type="hidden" name="existingData" value="${data ? data.submissionData : ''}">
                    </div>
                `;
                if(type === 'task' && data) autoFillLec();
            } else if (type === 'finance-balance') {
                container.innerHTML = `<div class="form-group"><label class="form-label">Saldo Utama</label><input type="number" name="balance" class="form-input" required value="${finance.currentBalance}"></div>`;
            } else if (type === 'finance' || (currentTab === 'finance' && !id)) {
                container.innerHTML = `
                    <div class="form-group"><label class="form-label">Nama</label><input type="text" name="name" class="form-input" required value="${data ? data.name : ''}"></div>
                    <div class="form-group"><label class="form-label">Jumlah</label><input type="number" name="amount" class="form-input" required value="${data ? data.amount : ''}"></div>
                    <div class="form-group"><label class="form-label">Tanggal</label><input type="date" name="date" class="form-input" required value="${data ? data.date : ''}"></div>
                `;
            }
        }

        function autoFillLec() {
            const sub = document.getElementById('taskSubSel').value;
            const lecIn = document.getElementById('taskLecIn');
            const sched = schedules.find(s => s.subject === sub);
            lecIn.value = sched ? sched.lecturer : '';
        }

        function toggleSubInp() {
            const type = document.querySelector('select[name="submissionType"]').value;
            document.getElementById('subTxt').style.display = type === 'text' ? 'block' : 'none';
            document.getElementById('subFile').style.display = type === 'file' ? 'block' : 'none';
        }

        // --- SUBMIT LOGIC ---
        document.getElementById('main-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const fd = new FormData(this);
            
            if (currentTab === 'schedule' || editingType === 'schedule') {
                const newItem = { 
                    id: editingId || Date.now(), 
                    subject: fd.get('subject'), lecturer: fd.get('lecturer'), 
                    day: fd.get('day'), time: fd.get('time'), room: fd.get('room') 
                };
                updateArr(schedules, newItem);
            } 
            else if (currentTab === 'daily' || editingType === 'daily') {
                updateArr(dailies, { id: editingId||Date.now(), event:fd.get('event'), date:fd.get('date'), time:fd.get('time') });
            }
            else if (currentTab === 'task' || editingType === 'task') {
                let subData = '';
                const type = fd.get('submissionType');
                if(type === 'text') subData = fd.get('submissionDataText');
                else {
                    const f = document.getElementById('subFile');
                    subData = f.files.length > 0 ? f.files[0].name : fd.get('existingData');
                }
                const oldT = editingId ? tasks.find(t=>t.id===editingId) : null;
                updateArr(tasks, { 
                    id: editingId||Date.now(), subject:fd.get('subject'), lecturer:fd.get('lecturer'), 
                    startDate:fd.get('startDate'), dueDate:fd.get('dueDate'), 
                    submissionType:type, submissionData:subData, 
                    status: oldT ? oldT.status : 'pending' 
                });
            }
            else if (currentTab === 'finance') {
                updateArr(finance.expenses, { id: editingId||Date.now(), name:fd.get('name'), amount:fd.get('amount'), date:fd.get('date') });
            }
            else if (editingType === 'finance-balance') {
                finance.currentBalance = fd.get('balance');
                saveData(); renderFinance(); closeModal(); showToast('Saldo Diupdate'); return;
            }

            saveData(); renderAll(); closeModal(); showToast('Berhasil Disimpan');
        });

        function updateArr(arr, item) {
            const idx = arr.findIndex(x => x.id === item.id);
            if(idx > -1) arr[idx] = item; else arr.push(item);
        }

        function deleteItem(type, id) {
            if(!confirm('Yakin hapus?')) return;
            if(type === 'schedule') schedules = schedules.filter(i => i.id !== id);
            if(type === 'daily') dailies = dailies.filter(i => i.id !== id);
            if(type === 'task') tasks = tasks.filter(i => i.id !== id);
            if(type === 'expense') finance.expenses = finance.expenses.filter(i => i.id !== id);
            saveData(); renderAll(); showToast('Terhapus');
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num);
        }
        function showToast(msg) {
            const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
